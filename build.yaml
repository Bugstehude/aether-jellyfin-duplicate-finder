changelog: "0.2.1.1: hotfix — v0.2.1.0's release notes and version number were correct, but the actual packaged DLL was stale: it still contained 0.2.0.0's code, because tools/package-plugin.sh trusted an out-of-band Release build (`dotnet publish --no-build`) that had gone stale rather than building it fresh itself. This meant NONE of the 13 safety fixes from the independent code review (the group-emptying guard, broadened delete-failure handling, the cache TOCTOU narrowing, disposal-race fix, cache checkpointing, etc.) actually reached anyone who installed v0.2.1.0, despite the release notes describing them as shipped. package-plugin.sh no longer trusts external build state — it always (re)builds Release itself before packaging. This release's contents are otherwise identical to the intended v0.2.1.0. If you installed v0.2.1.0, please update again — you did not actually receive those fixes until now. Previous: 0.2.1.0: Independent security/correctness review by a separate reviewer found 13 issues, all fixed. Scan-start no longer blocks the request thread on large libraries (moved to a background thread properly, not just a bare fire-and-forget call). Deletion now refuses to empty a stored group entirely (a bug could previously let an admin delete every remaining copy of a group in one request); the config page warns before deleting the last file in a folder shared with other content, and flags groups where the SAME item appears more than once. Delete failures on one file no longer abort the whole batch or skip cleanup bookkeeping for files that succeeded — broadened from two narrow exception types to catching whatever the underlying provider throws, and item pruning now compares parsed ids robustly. The size/mtime staleness check used by the hash cache now explicitly verifies a file exists rather than trusting a sentinel timestamp that a deleted file's failed stat call previously produced. A file modified mid-hash is now much less likely to poison the cache with a hash matching neither its old nor new content (an unavoidable narrow race, but far narrower than before). Two library entries resolving to the same physical file (bind mounts, alternate versions) no longer get reported as duplicates of themselves. The status page now keeps polling automatically once a scan is confirmed running, even if it wasn't the one that started it (e.g. after a page reload mid-scan). Saving the scope selection is now refused client-side if the folder list failed to load, instead of silently saving an incomplete/misleading scope. Fixed a shutdown race where an in-flight scan's semaphore release could throw after the scanner was already disposed. The hash cache is now checkpointed to disk periodically during a long scan (previously only written once at the very end, so a crash or restart mid-scan discarded all hashing progress) and stale entries for files no longer in the configured scope are pruned instead of accumulating forever. Added end-to-end test coverage for the full three-phase scan pipeline itself (progress accounting, the re-entrancy guard, cache pruning), which previously only had coverage for its individual phases in isolation. Previous: 0.2.0.0: Tier 1 scanning is now dramatically faster, especially on repeat scans. Full-file SHA-256 used to run on every single file regardless of whether anything else shared its size — now a three-phase pipeline (size grouping, a cheap 64 KiB quick hash, then the full hash only for real candidates) skips the expensive full read for the vast majority of files. Both hash phases are now cached per file (path/size/last-write time) across scans, so an unmodified file is never re-read at all on a later scan. No change in what counts as a duplicate — same guarantee as before, just far less I/O to get there. Previous: 0.1.2.0: fixed a follow-on display bug in the scope picker — a previously-selected subfolder was resolved to its real name (0.1.1.0) but always rendered flat at the top level instead of at its real position in the tree, and would show TWICE once its real library was expanded. Now the flat placeholder is replaced by the properly-nested row as soon as it's discovered, with a hint shown on any entry still awaiting that. Previous: 0.1.1.0: fixed two bugs found in first live testing. (1) /scan/status returned PascalCase JSON keys (Running, LastFinishedAt, ...) that never matched the config page's lowercase field reads, so the scan status/progress display never updated even though scans ran and completed correctly — the page looked broken/frozen on 'Never scanned yet.' the whole time. Fixed by explicitly emitting lowercase JSON from the API, matching the AETHER Analysis plugin's established convention. (2) the scope picker mislabeled previously-selected SUBFOLDERS as '(removed library ...)' on every page reload, because the removed-check only accounted for top-level libraries, never actually looking up subfolder ids before assuming they were gone. Now resolves them via the Items API and shows the real name. Also: a failed scan-start request is now shown on the page instead of failing silently. Previous: 0.1.0.0: initial release. Tier 1 (exact duplicates via SHA-256 file hash) only — perceptual near-duplicate detection (different encodes/quality of the same recording) is a planned follow-up, not yet implemented."
