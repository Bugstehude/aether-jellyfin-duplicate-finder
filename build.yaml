overview: "Finds real content duplicates in a Jellyfin library, not just metadata matches"
description: >
  Detects duplicate video files by actual file content — exact copies via file hash first,
  same-recording-different-encode next — scoped to admin-chosen libraries/subfolders. Never
  deletes automatically: results are grouped for review, deletion is an explicit, per-group,
  admin-confirmed action.
