changelog: "0.1.2.0: fixed a follow-on display bug in the scope picker — a previously-selected subfolder was resolved to its real name (0.1.1.0) but always rendered flat at the top level instead of at its real position in the tree, and would show TWICE once its real library was expanded. Now the flat placeholder is replaced by the properly-nested row as soon as it's discovered, with a hint shown on any entry still awaiting that. Previous: 0.1.1.0: fixed two bugs found in first live testing. (1) /scan/status returned PascalCase JSON keys (Running, LastFinishedAt, ...) that never matched the config page's lowercase field reads, so the scan status/progress display never updated even though scans ran and completed correctly — the page looked broken/frozen on 'Never scanned yet.' the whole time. Fixed by explicitly emitting lowercase JSON from the API, matching the AETHER Analysis plugin's established convention. (2) the scope picker mislabeled previously-selected SUBFOLDERS as '(removed library ...)' on every page reload, because the removed-check only accounted for top-level libraries, never actually looking up subfolder ids before assuming they were gone. Now resolves them via the Items API and shows the real name. Also: a failed scan-start request is now shown on the page instead of failing silently. Previous: 0.1.0.0: initial release. Tier 1 (exact duplicates via SHA-256 file hash) only — perceptual near-duplicate detection (different encodes/quality of the same recording) is a planned follow-up, not yet implemented."
